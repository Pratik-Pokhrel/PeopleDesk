name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run on the same branch when a newer commit arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Catches a broken schema.prisma and confirms the client can be generated
      - name: Validate and generate Prisma client
        run: |
          npx prisma validate
          npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      # The backend is plain JS with no build step, so this is its "build check": every file must at least parse
      - name: Syntax check
        run: find src prisma -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test --if-present

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
